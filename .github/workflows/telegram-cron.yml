name: Telegram Cron Reminder

on:
  schedule:
    # Run every 5 minutes to check for 10-minute task reminders
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allows manual triggering from GitHub Actions tab

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Cron Reminder Endpoint
        run: |
          # Use SITE_URL and CRON_SECRET from GitHub repository secrets
          curl -s -X GET "${{ secrets.SITE_URL }}/api/cron/hourly?secret=${{ secrets.CRON_SECRET }}"

